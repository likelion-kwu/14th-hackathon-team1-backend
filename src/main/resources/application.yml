# 모든 프로파일에 공통으로 적용되는 설정입니다.
#
# 배치 기준은 "환경마다 값이 달라지면 버그인가" 입니다.
# 환경마다 달라야 하는 값(DB 접속 정보 등)은 프로파일별 파일로 갑니다.
# 환경마다 달라지면 버그가 되는 값(타임존, 직렬화 규칙 등)은 여기 둡니다.
#
# spring.datasource.* 는 여기에 절대 넣지 않습니다. 프로파일과 무관하게 로드되어
# 플레이스홀더가 풀리지 않는 테스트 환경에서 빌드가 깨집니다.
#
# 테스트 전용 설정이 필요하면 src/test/resources/application.yml 이 아니라
# application-test.yml + @ActiveProfiles("test") 를 씁니다. 전자는 클래스패스에서
# 이 파일을 완전히 가려버려서 아래 설정이 조용히 전부 사라집니다.

spring:
  application:
    name: hackathon-backend

  profiles:
    # active 가 아니라 default 를 씁니다. 차이는 기동 로그 문구 하나입니다.
    #   active:  The following 1 profile is active: "local"
    #   default: No active profile set, falling back to 1 default profile: "local"
    # 배포 워크플로에서 --spring.profiles.active=prod 가 누락된 경우 후자가
    # 로그에서 눈에 띕니다. 다만 프로파일 누락 자체를 막아주지는 않습니다.
    # 두 설정 모두 플래그가 없으면 local 로 기동하고, 플래그가 있으면
    # 커맨드라인이 이 파일을 이기므로 prod 전환은 어느 쪽이든 정상 동작합니다.
    #
    # 주의: spring.profiles.active 가 비게 되므로 로그 패턴이나 설정값에서
    # ${spring.profiles.active} 플레이스홀더를 쓰면 해석에 실패합니다.
    default: local

  jackson:
    time-zone: Asia/Seoul
    # Boot 3 가이드에 흔히 나오는 serialization.write-dates-as-timestamps 설정은
    # 넣지 않습니다. Boot 4 가 쓰는 Jackson 3 에서 해당 상수가 SerializationFeature
    # 에서 제거됐고(넣으면 기동 실패), 날짜는 기본으로 ISO-8601 문자열로
    # 직렬화됩니다.

  jpa:
    properties:
      hibernate:
        timezone:
          # 시간 컬럼을 UTC 로 정규화해 저장합니다. "DB 에는 UTC, 표시는 KST" 규칙입니다.
          #
          # 명시하는 이유가 있습니다. 기본값(DEFAULT)은 dialect 가 타임존 컬럼을
          # 지원하는지에 따라 동작이 갈립니다. H2 는 NATIVE 라 오프셋을 컬럼에
          # 보존하지만 MySQL 은 지원하지 않아 UTC 로 정규화합니다. 그대로 두면
          # 테스트(H2)와 운영(MySQL)의 저장 형태가 달라지고, 테스트에서 통과한
          # 오프셋 관련 단정이 운영에서 깨집니다.
          #
          # 이 값을 고정하면 두 환경이 같은 형태로 저장하고, DB 를 직접 조회했을 때
          # 보이는 값이 UTC 라는 것도 규칙으로 설명됩니다.
          default_storage: NORMALIZE_UTC

    # 기본값이 true 입니다. 켜져 있으면 뷰 렌더링 구간까지 커넥션을 잡고 있어
    # 커넥션이 10개(Hikari 기본)뿐인 db.t3.micro 에서 체감됩니다.
    # 공통에 두는 이유는 로컬에서 LazyInitializationException 을 미리 만나는 것이
    # 운영에서 만나는 것보다 낫기 때문입니다.
    open-in-view: false

app:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  cors:
    # 로컬 개발용 기본값입니다. 운영에서는 application-prod.yml 이
    # CORS_ALLOWED_ORIGINS 환경변수로 덮습니다.
    # 여기에 기본값을 두어야 로컬과 테스트에서 환경변수 없이도 컨텍스트가 뜹니다.
    allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  # 이것이 없으면 모든 응답의 content-type 이 */* 로 나갑니다. 컨트롤러가
  # produces 를 명시하지 않으면 Spring 이 협상 가능한 모든 타입을 뜻하는 */* 를
  # 스펙에 싣기 때문입니다. 프론트가 스펙에서 코드를 생성할 때(orval,
  # openapi-typescript 등) */* 는 응답 타입 추론을 포기하게 만듭니다.
  #
  # 컨트롤러마다 produces = APPLICATION_JSON_VALUE 를 붙이는 대신 여기 한 줄로
  # 끝냅니다. 붙이는 방식은 새 컨트롤러에서 빠뜨리기 쉽고, 빠뜨려도 아무 경고가
  # 없습니다.
  default-produces-media-type: application/json

# 운영 프로파일입니다. systemd 가 --spring.profiles.active=prod 로 활성화합니다.
#
# 값을 하드코딩하지 않고 전부 환경변수를 참조합니다. 이 파일은 레포에 커밋되므로
# 자격증명이 들어가면 이력에 영구히 남습니다. 실제 값은 EC2 의
# /etc/hackathon.env (권한 600) 에 두고 systemd 의 EnvironmentFile 로 주입합니다.
#
# datasource 는 이 파일에만 둡니다. 공통 application.yml 에 넣으면 프로파일과
# 무관하게 로드되어, JPA 를 붙인 뒤에는 플레이스홀더가 풀리지 않는 테스트에서
# "'url' must start with jdbc" 로 빌드가 깨집니다.
#
# 환경변수 누락 검증은 애플리케이션이 아니라 systemd 의 ExecStartPre 가 담당합니다.
# 자바 쪽 가드는 dataSource 빈이 먼저 생성되면서 무력화되고, 무엇보다
# DB_USERNAME 만 누락된 경우에는 기동에 성공한 뒤 첫 쿼리에서
# "Access denied for user '${DB_USERNAME}'" 로 터지기 때문에 앱에서 잡기 어렵습니다.
# 여기에 자바 가드를 중복으로 추가하지 마십시오.

spring:
  datasource:
    # 인프라 쪽에서 /etc/hackathon.env 에 아래 형태로 넣어야 합니다.
    #   DB_URL=jdbc:mysql://<rds-endpoint>:3306/hackathon?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    #
    # connectionTimeZone 은 Connector/J 8.0.23 부터의 정식 이름입니다.
    # 예전 가이드에 나오는 serverTimezone 은 현재 별칭으로만 유효합니다.
    #
    # characterEncoding 은 기본값이 없어 서버 charset 과 협상합니다.
    # RDS 파라미터 그룹에 의존하지 않도록 명시합니다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 기본값은 30초입니다. /health 가 DB 접속을 확인하므로, RDS 가 응답하지
      # 않으면 그 요청이 30초 매달립니다. 스모크 테스트와 모니터링이 그만큼
      # 멈추므로 짧게 잡습니다.
      connection-timeout: 2000

  jpa:
    hibernate:
      # 배포 파이프라인을 구축하는 기간에만 update 로 둡니다.
      # 엔티티를 여러 명이 동시에 수정하기 시작하면 validate 로 바꾸고,
      # "엔티티 변경 PR 에는 마이그레이션 SQL 첨부" 를 팀 규칙으로 정합니다.
      #
      # update 는 컬럼 삭제와 타입 축소를 하지 않습니다. 따라서 엔티티에서 필드를
      # 지우거나 이름을 바꾸면 DB 에 유령 컬럼이 남고, 그 컬럼이 NOT NULL 이면
      # 이후 INSERT 가 전부 실패합니다. 필드 삭제나 리네임을 했다면 DB 에서
      # 해당 컬럼을 직접 정리해야 합니다.
      #
      # create-drop 은 어떤 이유로도 이 파일에 들어가지 않습니다. 재기동마다
      # 운영 데이터가 전부 지워집니다.
      ddl-auto: update

server:
  # Nginx가 전달하는 X-Forwarded-* 헤더를 신뢰해 Swagger UI의 Try it out URL과 리다이렉트 URL이 HTTPS를 사용하도록 합니다.
  forward-headers-strategy: framework

springdoc:
  # 해커톤 기간에는 열어 둡니다. 원래 ${SWAGGER_ENABLED:false} 였습니다.
  #
  # 바꾼 이유는 운영 방침이 아니라 접근 수단입니다. 닫혀 있는 동안 Swagger 를
  # 켜려면 EC2 에 SSH 로 들어가 /etc/hackathon.env 를 고쳐야 하는데, 지금 팀에
  # pem 키를 가진 사람이 없습니다. 반면 이 파일은 main 에 머지하면 GitHub
  # Actions 가 알아서 배포하므로 SSH 없이 반영됩니다.
  #
  # 환경변수 참조(${SWAGGER_ENABLED:...})를 아예 걷어낸 이유가 중요합니다.
  # 기본값만 true 로 바꾸면, 인프라 세팅 때 /etc/hackathon.env 에
  # SWAGGER_ENABLED=false 가 이미 들어가 있는 경우 환경변수가 이겨서 그대로
  # 닫혀 있습니다. 그리고 그것을 고치려면 다시 SSH 가 필요합니다. 레포에서는
  # 그 파일 내용을 확인할 수 없으므로, 확실하게 열리도록 값을 고정합니다.
  #
  # 어차피 SSH 를 쓸 수 없으니 환경변수로 끄는 탈출구는 지금 아무 쓸모가 없습니다.
  #
  # 열어 두는 동안의 위험은 알고 있어야 합니다. 전체 엔드포인트와 필드가
  # 공개되고, Swagger UI 의 "Try it out" 이 외부인에게 쓰기 요청 폼이 됩니다.
  # 심사가 끝나면 이 값을 false 로 되돌려 머지하십시오.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  api:
    # OpenAPI spec을 파일로 내려받거나 외부에서 열어도 실제 HTTPS API를 호출하도록 공개 주소를 고정합니다.
    public-url: ${PUBLIC_API_URL:https://hey-service.duckdns.org}
  cors:
    # 공통 application.yml 의 로컬 기본값을 덮습니다.
    #
    # 기본값을 붙여 둔 이유는 기동 실패를 막기 위해서입니다. 기본값이 없으면
    # /etc/hackathon.env 에서 이 변수가 빠지는 순간 플레이스홀더가 풀리지 않아
    # 앱이 아예 뜨지 않습니다. 프론트 연동이 안 되는 것과 서버가 죽는 것은
    # 심각도가 다릅니다.
    #
    # 주의: 환경변수가 설정돼 있으면 그쪽이 이깁니다. 따라서 허용 주소를
    # 추가하려면 여전히 /etc/hackathon.env 를 고쳐야 하고 SSH 가 필요합니다.
    # SSH 를 쓸 수 없는 상황에서 주소를 추가해야 한다면, springdoc 설정에서
    # 했던 것처럼 이 줄의 환경변수 참조를 걷어내고 값을 직접 적으십시오.
    # 그때는 인프라 담당자에게 반드시 공유해야 합니다.
    #
    # 값에는 와일드카드를 쓸 수 있습니다(CorsConfig 가 allowedOriginPatterns 를
    # 씁니다). 프론트 Vercel 프리뷰 주소처럼 배포마다 바뀌는 경우
    # https://*.vercel.app 형태로 적으면 됩니다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# 넣지 않는 설정과 그 이유입니다. Boot 3 기준 가이드를 보고 추가하지 마십시오.
#
# server.address: 127.0.0.1
#   Nginx 를 앞에 세운 뒤에야 의미가 있습니다. 지금 넣으면 외부에서 8080 접근이
#   막혀 배포 검증(외부 curl)이 실패합니다. Nginx 를 도입할 때는 이 설정과 함께
#   server.forward-headers-strategy: framework 도 넣어야 합니다. 없으면
#   리다이렉트와 Swagger UI 의 서버 URL 이 http://127.0.0.1:8080 으로 나갑니다.
#
# server.shutdown: graceful
#   Boot 4 의 기본값이 이미 graceful 입니다. Boot 3 에서는 immediate 가 기본이라
#   가이드마다 명시하라고 하지만 지금은 불필요합니다.
#
# server.error.include-message / include-stacktrace / include-binding-errors
#   전부 기본값이 never 입니다. 에러 응답 형태는 공통 예외 핸들러에서 다룹니다.

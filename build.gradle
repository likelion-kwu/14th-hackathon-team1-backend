plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hackathon'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// @Valid / @NotBlank 를 쓰려면 별도로 필요합니다.
	// 없으면 @Valid 가 조용히 무시되어 예외 핸들러의 400 분기가 영원히 타지 않습니다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Boot 4 는 springdoc 을 의존성 관리하지 않으므로 버전을 명시합니다.
	// 2.x 는 Spring Framework 6 대상이라 Boot 4 에서 동작하지 않습니다.
	// 3.0.x 부터 Framework 7 / Boot 4 를 지원합니다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// 운영 DB 드라이버입니다. 컴파일 시점에는 필요 없습니다.
	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// Boot 4 는 테스트 슬라이스를 모듈별로 쪼갰습니다. @DataJpaTest 는 별도
	// 스타터에 들어 있어서, 이것 없이는 애노테이션 자체를 찾을 수 없습니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

	// 테스트는 설정 탐색이 클래스패스로 제한되어 datasource 설정이 없습니다.
	// H2 가 클래스패스에 있으면 Boot 가 인메모리 DB 를 자동 구성하므로
	// 별도 테스트 설정 파일 없이 @SpringBootTest 가 뜹니다.
	// 다만 DDL 은 H2 방언으로만 검증되고 MySQL 방언은 검증되지 않습니다.

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// named('test') 가 아니라 withType(Test) 를 씁니다.
// 나중에 integrationTest 같은 Test 태스크를 추가해도 아래 격리를 상속합니다.
tasks.withType(Test).configureEach {
	useJUnitPlatform()

	// 테스트의 작업 디렉토리가 프로젝트 루트라서, 기본 설정 탐색 경로에 포함된
	// ./config/ 의 application-local.yml 이 테스트 컨텍스트로 딸려 들어옵니다.
	// 각자 로컬 DB 자격증명이 다르므로 그대로 두면 테스트가 사람마다 다르게 깨집니다.
	// spring.config.location 은 기본 탐색 경로를 대체하므로 file: 경로가 전부 빠집니다.
	//
	// optional: 을 붙이는 이유는 매칭되는 설정 파일이 하나도 없을 때의 기동 실패를
	// 막기 위해서입니다. 붙이지 않으면 src/main/resources/application.yml 의 존재가
	// 빌드 전제조건이 되고, 누군가 그 파일을 옮기면 원인을 찾기 어려운 전체
	// 테스트 실패로 나타납니다.
	//
	// 주의: IDE 자체 JUnit 러너로 돌리면 이 설정이 적용되지 않아
	// Gradle 과 결과가 갈릴 수 있습니다. 테스트는 ./gradlew test 로 확인합니다.
	systemProperty 'spring.config.location', 'optional:classpath:/,optional:classpath:/config/'
}

// toolchain 이 17 이라 JDK 18+ 의 "기본 UTF-8" 보장을 받지 못합니다.
// 한글 주석/문자열이 있으므로 CI 러너의 로케일과 무관하게 UTF-8 로 고정합니다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// 배포 스크립트가 버전 문자열에 의존하지 않도록 산출물 이름을 고정합니다.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

// plain jar 를 끄지 않으면 build/libs 에 jar 가 2개 생겨
// 배포 스크립트가 글롭(*.jar)을 쓰는 순간 어느 것이 실행 가능한지 모호해집니다.
tasks.named('jar') {
	enabled = false
}

// application-local.yml 은 각자의 로컬 DB 자격증명을 담습니다.
// src/main/resources 에 두면 jar 안으로 패키징돼 배포 산출물에 실리므로 제외합니다.
// 로컬 실행 시에는 프로젝트 루트의 config/ 에 두면 Boot 가 자동으로 읽습니다.
tasks.named('processResources') {
	exclude 'application-local.y*ml'
}

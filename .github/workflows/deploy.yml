name: deploy

# main push 시 자동 배포합니다.
# workflow_dispatch 를 함께 두는 이유는 배포가 실패했을 때 코드 변경 없이
# 재시도할 수 있어야 하기 때문입니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 서비스가 두 번 재시작되면서 스모크 테스트가 서로를 방해합니다.
# 진행 중인 배포는 취소하지 않고(중간에 끊기면 서버 상태가 애매해집니다)
# 순서대로 실행합니다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # bootJar 가 아니라 build 를 씁니다.
      # bootJar 는 test 에 의존하지 않아서, bootJar 만 쓰면 테스트가 한 번도 돌지 않습니다.
      - name: 빌드 및 테스트
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # StrictHostKeyChecking 을 끄지 않고 호스트 키를 미리 등록합니다.
          # 끄면 중간자 공격을 감지할 수 없습니다.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare runtime environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY GitHub Secret is required."
            exit 1
          fi
          umask 077
          printf 'OPENAI_API_KEY=%s\nCORS_ALLOWED_ORIGINS=%s\n' \
            "$OPENAI_API_KEY" "https://hey-service.vercel.app" > "$RUNNER_TEMP/hackathon.env.update"

      - name: Apply runtime environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/hackathon.env.update" \
            "$EC2_USER@$EC2_HOST:/tmp/hackathon.env.update"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'sudo sed -i "/^OPENAI_API_KEY=/d; /^CORS_ALLOWED_ORIGINS=/d" /etc/hackathon.env && \
             sudo tee -a /etc/hackathon.env < /tmp/hackathon.env.update > /dev/null && \
             sudo chmod 600 /etc/hackathon.env && \
             rm -f /tmp/hackathon.env.update'

      # 전송 중 실패해도 실행 중인 jar 가 깨지지 않도록 임시 경로로 보낸 뒤 교체합니다.
      - name: jar 전송
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key build/libs/app.jar "$EC2_USER@$EC2_HOST:/tmp/app.jar.new"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'mv /tmp/app.jar.new /opt/hackathon/app.jar'

      - name: 서비스 재시작
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'sudo systemctl restart hackathon'

      # 이 단계를 빼면 "배포는 성공했는데 앱은 죽어있는" 상태를 잡을 수 없습니다.
      # /health 는 DB 접속까지 확인해서 DB 가 끊기면 503 을 반환하므로,
      # 상태 코드만 판정하면 충분합니다. 본문을 파싱하면 응답 형태가 바뀔 때
      # 조용히 깨집니다.
      - name: 스모크 테스트
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://$EC2_HOST:8080/health" > /tmp/health.json; then
              echo "스모크 테스트 통과"
              cat /tmp/health.json
              exit 0
            fi
            echo "대기 중... ($i/30)"
            sleep 4
          done
          echo "스모크 테스트 실패: /health 가 2분 안에 응답하지 않았습니다."
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@$EC2_HOST" \
            'sudo journalctl -u hackathon -n 50 --no-pager' || true
          exit 1

      - name: 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
